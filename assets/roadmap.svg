<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Career roadmap: Today — Digital Health Operations; Now building — Full-Stack and AI skills; Future goal — Full-Stack AI Engineer for digital health">
  <style>
    .t   { font: 700 15px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; }
    .h   { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0b2f6b; }
    .li  { font: 400 15.5px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .ttl { font: 800 26px 'Segoe UI', Arial, sans-serif; fill: #0b2f6b; }
    .sub { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    .pulse { animation: p 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes p { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .55; } }
  </style>

  <rect width="1000" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="52" class="ttl">My Journey</text>
  <text x="40" y="78" class="sub">Where I am today, what I'm building, and where I'm going</text>

  <line x1="185" y1="130" x2="815" y2="130" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="130" x2="500" y2="130" stroke="#0a5fa8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="185" cy="130" r="13" fill="#0a5fa8"/>
  <circle class="pulse" cx="500" cy="130" r="13" fill="#f7941d"/>
  <circle cx="815" cy="130" r="13" fill="#ffffff" stroke="#0a5fa8" stroke-width="4"/>

  <g transform="translate(40,165)">
    <rect width="290" height="235" rx="14" fill="#f1f6fc" stroke="#d6e4f5"/>
    <rect width="290" height="6" rx="3" fill="#0a5fa8"/>
    <text x="22" y="40" class="t" fill="#0a5fa8">TODAY</text>
    <text x="22" y="72" class="h" style="font-size:21px">Digital Health Operations</text>
    <text x="22" y="110" class="li">• RAAD EHR (OpenMRS / Bahmni)</text>
    <text x="22" y="138" class="li">• DHIS2 integration &amp; reporting</text>
    <text x="22" y="166" class="li">• Clinical form configuration</text>
    <text x="22" y="194" class="li">• HMIS officer training &amp; support</text>
  </g>

  <g transform="translate(355,165)">
    <rect width="290" height="235" rx="14" fill="#fff6ec" stroke="#fbdcb6"/>
    <rect width="290" height="6" rx="3" fill="#f7941d"/>
    <text x="22" y="40" class="t" fill="#d97706">NOW BUILDING</text>
    <text x="22" y="72" class="h">Full-Stack &amp; AI Skills</text>
    <text x="22" y="110" class="li">• Python, SQL &amp; data analytics</text>
    <text x="22" y="138" class="li">• APIs with FastAPI &amp; Node.js</text>
    <text x="22" y="166" class="li">• React, PostgreSQL, Prisma</text>
    <text x="22" y="194" class="li">• Docker &amp; Linux</text>
  </g>

  <g transform="translate(670,165)">
    <rect width="290" height="235" rx="14" fill="#0b2f6b"/>
    <text x="22" y="40" class="t" fill="#7cc4ff">FUTURE GOAL</text>
    <text x="22" y="72" style="font:700 22px 'Segoe UI',Arial,sans-serif;fill:#ffffff">Full-Stack AI Engineer</text>
    <text x="22" y="110" style="font:400 15.5px 'Segoe UI',Arial,sans-serif;fill:#dbeafe">• AI &amp; automation for digital health</text>
    <text x="22" y="138" style="font:400 15.5px 'Segoe UI',Arial,sans-serif;fill:#dbeafe">• End-to-end AI products: data,</text>
    <text x="34" y="160" style="font:400 15.5px 'Segoe UI',Arial,sans-serif;fill:#dbeafe">APIs and web apps</text>
    <text x="22" y="190" style="font:400 15.5px 'Segoe UI',Arial,sans-serif;fill:#dbeafe">• Smart tools that save time</text>
    <text x="34" y="212" style="font:400 15.5px 'Segoe UI',Arial,sans-serif;fill:#dbeafe">and improve decisions</text>
  </g>
</svg>
